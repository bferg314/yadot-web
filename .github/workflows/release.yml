name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      released: ${{ steps.get_version.outputs.released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@yadot-web
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@yadot-web
        run: npx semantic-release

      - name: Get new version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # @semantic-release/npm rewrites package.json only when it releases,
          # so a version that differs from the pushed commit's (github.sha; HEAD is
          # now the release commit) means a new release.
          BEFORE=$(git show ${{ github.sha }}:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$VERSION" != "$BEFORE" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "Released version: $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "No release (still $VERSION)"
          fi

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so docker.yml's
  # tag trigger never fired and every image so far was built by hand. Call it here.
  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
