services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yadot-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Optional: Set a default reference date
      # - NEXT_PUBLIC_REFERENCE_DATE=2000-01-01
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
